name: ScentMarked checks

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scentmarked-mvp-v0.5/**'
      - '.github/workflows/scentmarked-checks.yml'
  pull_request:
    paths:
      - 'scentmarked-mvp-v0.5/**'
      - '.github/workflows/scentmarked-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scentmarked-mvp-v0.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --save-text-lockfile
      - name: Commit generated Bun lockfile
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || git commit -m "Commit Bun lockfile"
          git diff --cached --quiet && git push || true
      - name: Upload generated Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: scentmarked-bun-lockfile
          path: scentmarked-mvp-v0.5/bun.lock
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck and build
        run: bun run check
