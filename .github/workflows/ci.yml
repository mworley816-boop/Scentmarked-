name: ScentMarked CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scentmarked-mvp-v0.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm install

      - name: Report dependency advisories
        run: npm audit --omit=dev || true

      - name: Report deprecated dependency paths
        run: npm ls glob node-domexception || true

      - name: Typecheck, test, and build for Cloudflare
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
