name: Scentmarked Production Smoke

on:
  schedule:
    # Daily UTC check of the deployed public site, in addition to manual runs.
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: HTTPS origin of the deployed Scentmarked site
        required: true
        default: https://scentmarked.com
        type: string
      minimum_published:
        description: Minimum published perfumes expected on Discover
        required: true
        default: '673'
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: scentmarked-mvp-v0.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check live site and published catalog count
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://scentmarked.com' }}
          SCENTMARKED_MIN_PUBLISHED_PERFUMES: ${{ inputs.minimum_published || '673' }}
        run: |
          set -o pipefail
          node scripts/smoke-production.mjs 2>&1 | tee production-smoke.log
      - name: Publish smoke test summary
        if: always()
        env:
          SMOKE_SITE_URL: ${{ inputs.site_url || 'https://scentmarked.com' }}
          SMOKE_MINIMUM: ${{ inputs.minimum_published || '673' }}
        run: |
          {
            echo '## Scentmarked production smoke'
            echo ''
            printf 'Target: `%s`\n' "$SMOKE_SITE_URL"
            printf 'Minimum published perfumes: `%s`\n' "$SMOKE_MINIMUM"
            echo ''
            echo '```text'
            if [ -f production-smoke.log ]; then tail -n 90 production-smoke.log; else echo 'Smoke script did not start.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scentmarked-production-smoke-log
          path: scentmarked-mvp-v0.5/production-smoke.log
          if-no-files-found: ignore
          retention-days: 14
