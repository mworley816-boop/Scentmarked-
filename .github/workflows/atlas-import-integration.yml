name: Atlas import SQL integration

on:
  pull_request:
    paths:
      - 'scentmarked-mvp-v0.5/supabase/baseline/**'
      - 'scentmarked-mvp-v0.5/supabase/migrations/20261101*atlas*'
      - 'scentmarked-mvp-v0.5/supabase/tests/atlas_import*'
      - 'scentmarked-mvp-v0.5/supabase/tests/core_baseline_auth_stub.sql'
      - '.github/workflows/atlas-import-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: atlas_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:localtest@127.0.0.1:5432/atlas_integration
      ATLAS_DISPOSABLE_DB: 'true'
      ATLAS_SCHEMA_BOOTSTRAPPED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify local disposable target
        run: bash scentmarked-mvp-v0.5/supabase/tests/guard_disposable_database.sh
      - name: Bootstrap core schema and Atlas prerequisites
        run: |
          set -euo pipefail
          base=scentmarked-mvp-v0.5/supabase
          for sql in tests/core_baseline_auth_stub.sql baseline/001_public_schema.sql baseline/002_indexes.sql tests/atlas_import_postgres_stub.sql migrations/20261101090000_atlas_catalog_import_ledger.sql migrations/20261101100000_atlas_atomic_catalog_import.sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$base/$sql"
          done
      - name: Execute Atlas security and rollback fixtures
        run: bash scentmarked-mvp-v0.5/supabase/tests/run_atlas_sql_integration.sh
